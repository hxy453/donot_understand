<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GitHub Pages Site</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Arial, "Microsoft YaHei", sans-serif;
        background: #f7f7f4;
        color: #202124;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(720px, calc(100% - 48px));
      }

      h1 {
        font-size: clamp(32px, 6vw, 64px);
        line-height: 1.05;
        margin: 0 0 18px;
      }

      p {
        font-size: 18px;
        line-height: 1.7;
        margin: 0;
        color: #4a4f55;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #111315;
          color: #f5f7f8;
        }

        p {
          color: #c4c9cf;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>GitHub Pages 已准备就绪</h1>
      <p>把这个站点推送到 GitHub 并启用 Pages 后，这里就是你的公开网页。</p>
    </main>
  </body>
</html>
